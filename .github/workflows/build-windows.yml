name: Build (Windows)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        config: [Release, Shipping]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build ${{ matrix.config }}
        run: cmake --build build --config ${{ matrix.config }}
